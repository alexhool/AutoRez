; Automatically switches the loaded layout based on screen resolution

[Rainmeter]
Update=#UpdateRate#

[Metadata]
Name=AutoRez
Author=alexhool
Information=Automatically switches the loaded layout based on screen resolution|https://github.com/alexhool/AutoRez
Version=1.0.1
License=GPL-3.0-or-later

[Variables]
@Include=#@#Variables.inc

[MeasureMain]
Measure=Plugin
Plugin=SysInfo
SysInfoType=SCREEN_SIZE

[MeasureCombinedWidth]
Measure=Plugin
Plugin=SysInfo
SysInfoType=VIRTUAL_SCREEN_WIDTH

[MeasureCombinedHeight]
Measure=Plugin
Plugin=SysInfo
SysInfoType=VIRTUAL_SCREEN_HEIGHT

[MeasureScript]
Measure=Script
ScriptFile=#@#AutoRez.lua

[MeterRequired]
Meter=String
Hidden=1
